/* ===========================  utils  =========================== */

function iconForFile(name) {
  const ext = (name.split('.').pop() || '').toLowerCase();
  if (['jpg','jpeg','png','gif','webp','heic','bmp','svg'].includes(ext)) return '🖼️';
  if (['mp4','mov','avi','mkv','webm'].includes(ext)) return '🎬';
  if (['mp3','wav','flac','m4a','aac'].includes(ext)) return '🎵';
  if (['pdf'].includes(ext)) return '📄';
  if (['doc','docx'].includes(ext)) return '📝';
  if (['xls','xlsx','csv'].includes(ext)) return '📊';
  if (['ppt','pptx','key'].includes(ext)) return '📽️';
  if (['zip','rar','7z','tar','gz'].includes(ext)) return '🗜️';
  return '📎';
}
function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  const kb = bytes / 1024;
  if (kb < 1024) return kb.toFixed(1) + ' KB';
  const mb = kb / 1024;
  if (mb < 1024) return mb.toFixed(2) + ' MB';
  return (mb / 1024).toFixed(2) + ' GB';
}

            <div className="flex items-center gap-2.5 py-2 pb-3.5 border-b border-border shrink-0">
              <div className="text-[15px] font-semibold flex-1 truncate min-w-0">{conv?.title}</div>
              <div className="text-[12px] text-text-3 shrink-0">超级小爱 · 历史对话</div>
            </div>
            <MessageList messages={conv?.messages || []} />
          </div>
        )}
      <div className="px-6 pb-6 pt-4 shrink-0 flex justify-center">
        <ChatInputFull placeholder="发消息或 @ 设备帮你做事" value={inputValue} onChange={setInputValue} />
      </div>
    </div>
  );
}

function ShareDialog({ file, onClose }) {
  useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, [onClose]);
  if (!file) return null;
  const ext = (file.name.split('.').pop() || '').toUpperCase() || 'FILE';
  return (
    <div className="fixed inset-0 z-[100] flex items-center justify-center animate-fadeIn">
      <div className="absolute inset-0 bg-black/[.18] backdrop-blur-sm" onClick={onClose} />
      <div className="relative w-[380px] max-w-[90vw] rounded-[14px] overflow-hidden animate-popIn shadow-modal" style={{ background:'#f2efe8' }}>
        <div className="px-5 pt-4 pb-1 text-[17px] font-semibold">发送</div>
        <div className="flex flex-col items-center gap-0.5 px-5 pt-3 pb-5">
          <div className="w-14 h-14 rounded-xl file-grad flex items-center justify-center text-[28px] mb-1.5">{iconForFile(file.name)}</div>
          <div className="text-[14px] font-semibold max-w-[300px] truncate">{file.name}</div>
          <div className="text-[12px] text-text-3">{ext} · {formatSize(file.size)}</div>
        </div>
        <div className="px-5 pt-3.5 pb-4 border-t border-black/[.06]">
          <div className="text-[12px] text-text-2 mb-3">我的设备</div>
          <div className="flex flex-wrap gap-5">
            {[{ icon:'📱', name:'Xiaomi MIX Flip 2' }, { icon:'📲', name:'Xiaomi Pad 6S Pro' }].map((d, i) => (
              <div key={i} onClick={onClose} className="flex flex-col items-center gap-1.5 cursor-pointer hover:scale-105 transition-transform w-[70px]">
                <div className="w-12 h-12 rounded-full device-grad flex items-center justify-center text-[20px]">{d.icon}</div>
                <div className="text-[11.5px] text-text text-center leading-[1.3]">{d.name}</div>
              </div>
            ))}
          </div>
        </div>
        <div className="px-5 pt-3.5 pb-4 border-t border-black/[.06]">
          <div className="text-[12px] text-text-2 mb-3">其他设备</div>
          <div className="text-[12px] text-text-3 text-center py-4">附近暂无可接收设备</div>
        </div>
        <div className="flex justify-end px-4 py-3 border-t border-black/[.06]">
          <button onClick={onClose} className="bg-[#dcd9d2] hover:bg-[#ccc9c2] text-text text-[13px] px-4.5 py-1.5 rounded-lg transition-colors">取消</button>
        </div>
      </div>
    </div>
  );
}

function AddDeviceDialog({ open, onClose }) {
  useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, [onClose]);
  if (!open) return null;
  return (
    <div className="fixed inset-0 z-[100] flex items-center justify-center animate-fadeIn">
      <div className="absolute inset-0 bg-black/[.18] backdrop-blur-sm" onClick={onClose} />
      <div className="relative w-[460px] max-w-[90vw] rounded-[14px] p-11 px-11 pb-5 animate-popIn shadow-modal flex flex-col items-center" style={{ background:'#f2efe8' }}>
        <button onClick={onClose} className="absolute top-3.5 right-3.5 w-7 h-7 rounded-full bg-black/[.08] hover:bg-black/[.14] text-text-2 flex items-center justify-center">
          <Icon.Close width="14" height="14" />
        </button>
        <div className="text-[22px] font-bold text-text mb-2.5 text-center">我的设备</div>
        <div className="text-[13px] text-text-2 leading-[1.65] text-center max-w-[360px]">请确保小米手机在附近,手机系统已升级至小米澎湃 OS 3,并与 Mac 登录相同小米账号、连接相同网络</div>

        <div className="relative w-[240px] h-[240px] my-10 mb-7 flex items-center justify-center">
          <div className="absolute rounded-full bg-white/85 z-[2] shadow-soft" style={{ width:'44px', height:'44px' }} />
          <div className="absolute rounded-full bg-white/50 animate-scan" />
          <div className="absolute rounded-full bg-white/50 animate-scan" style={{ animationDelay:'1.2s' }} />
        </div>

        <div className="w-full max-w-[360px] py-3 rounded-full bg-black/[.05] text-text-3 text-[14px] font-medium text-center mb-3.5">搜索中...</div>
        <div className="text-[12.5px] text-text-2 text-center">未搜索到小米手机或平板?尝试<a className="text-accent cursor-pointer ml-0.5 hover:underline">扫码添加</a></div>
      </div>
    </div>
  );
}

/* ===========================  App  =========================== */

function App() {
  const [activeTab,    setActiveTab]    = useState('hub');
  const [chatMode,     setChatMode]     = useState('off'); // 'off' | 'side' | 'full'
  const [activeConvId, setActiveConvId] = useState(null);
  const [share,        setShare]        = useState(null);  // file or null
  const [addDeviceOpen,setAddDeviceOpen]= useState(false);
  const [copilotCollapsed, setCopilotCollapsed] = useState(false);

  const conv = activeConvId ? CONVERSATIONS[activeConvId] : null;
  const inFullscreen = chatMode === 'full';
  const isImmersive = ['cloud-photo', 'find-device'].includes(activeTab);

  const onSelectTab = (id) => { setActiveTab(id); setChatMode(prev => prev === 'full' ? 'off' : prev); };
  const onSidebarNewChat = () => { setActiveConvId(null); setChatMode('full'); };
  const onCopilotNewChat = () => { setActiveConvId(null); setChatMode(c => c === 'full' ? 'off' : c); };
  const onOpenConv = (id) => { setActiveConvId(id); /* keep current chat mode */ };
  const onExpand = () => setChatMode('full');

  return (
    <div className="max-w-[1280px] mx-auto px-5 py-6 pb-16">
      <h1 className="text-[22px] font-semibold mb-1 tracking-tight">方案 4 · 工具主 + AI 副驾</h1>
      <p className="text-text-2 text-[14px] mb-3">React + Tailwind 重写版 · 单文件原型(CDN)</p>

      <div className="bg-accent-bg border-l-[3px] border-accent rounded-md px-3.5 py-2.5 text-[13px] text-text-2 mb-6 leading-[1.7]">
        <b className="text-text">核心理念</b>:工具/设备/云服务为主界面,超级小爱作为右侧常驻副驾(可展开为全屏)。
        <br />
        <b className="text-text">试试</b>:左栏 <b>＋ 新建对话</b> → 全屏新建 · 副驾头部 <b>✏️ 新建对话</b> → 就地新建 · 历史对话保持当前模式 · 拖文件到「小米互传」弹发送框
      </div>

      <div className="app-bg border border-border rounded-2xl shadow-lg overflow-hidden flex flex-col h-[680px] relative">
        <TitleBar rightSlot={!inFullscreen && copilotCollapsed ? (
          <button onClick={() => setCopilotCollapsed(false)} title="展开 AI 副驾"
                  className="w-7 h-7 rounded-md text-text-2 hover:text-text flex items-center justify-center hover:bg-black/[.05]">
            <Icon.SidebarRight width="15" height="15" />
          </button>
        ) : null} />
        <div className="flex flex-1 min-h-0">
          {!isImmersive && (
            <Sidebar activeTab={activeTab}
                     onSelectTab={onSelectTab}
                     onNewChat={onSidebarNewChat}
                     onOpenConv={onOpenConv} />
          )}

          {!inFullscreen && (
            <div className="flex-1 flex flex-col min-w-0">
              {isImmersive && (
                <div className="h-[40px] px-4 border-b border-border flex items-center gap-2 shrink-0 bg-surface-2">
                  <button onClick={() => setActiveTab('hub')} className="text-[13px] text-text-2 hover:text-text flex items-center gap-1 cursor-pointer">
                    <span>←</span> 返回
                  </button>
                </div>
              )}
              {activeTab === 'hub'         && <DeviceHubPage onAddDevice={() => setAddDeviceOpen(true)} onTransferClick={() => {}} onTransferDrop={(f) => setShare(f)} />}
              {activeTab === 'transfer'    && <TransferPage />}
              {activeTab === 'cloud-photo' && <CloudPhotoPage />}
              {activeTab === 'cloud-note'  && <CloudNotePage />}
              {activeTab === 'find-device' && <FindDevicePage />}
              {activeTab === 'discover'    && <DiscoverPage />}
              {activeTab === 'files'       && <FilesPage />}
              {activeTab === 'cross'       && <CrossPage />}
              {activeTab === 'settings'    && <SettingsPage />}
            </div>
          )}

          <FullscreenChat visible={inFullscreen}
                          mode={activeConvId ? 'conv' : 'welcome'}
                          conv={conv} />

          {!inFullscreen && !copilotCollapsed && (
            <Copilot mode={activeConvId ? 'conv' : 'welcome'}
                     conv={conv}
                     onNewChat={onCopilotNewChat}
                     onExpand={onExpand}
                     onCollapse={() => setCopilotCollapsed(true)} />
          )}
        </div>
      </div>

      <ShareDialog file={share} onClose={() => setShare(null)} />
      <AddDeviceDialog open={addDeviceOpen} onClose={() => setAddDeviceOpen(false)} />

      <div className="mt-5 p-4 px-5 bg-surface border border-border rounded-xl text-[13px] text-text-2 leading-[1.8]">
        <b className="text-text">技术栈</b>:React 18 (UMD CDN) · Tailwind CSS (CDN, JIT) · Babel Standalone · 零构建,直接打开 HTML 即可。<br />
        研发把这个文件迁到 Vite/Electron 项目时:把 CDN 的 script 标签换成 npm 依赖,Tailwind config 已在 tailwind.config.js 直接复用,组件可按 App 内部拆分搬到 src/components/*.tsx。状态管理简单可改 Zustand。
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
