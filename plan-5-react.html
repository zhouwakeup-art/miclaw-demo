function NavItem({ icon, label, active, onClick, accent, className='' }) {
  return (
    <div onClick={onClick}
         className={`flex items-center gap-2 px-2.5 py-1.5 rounded-md text-[13px] cursor-pointer mb-px transition-colors
                    ${active ? 'bg-black/[.06] text-text font-medium' : 'text-text-2 hover:bg-black/[.04] hover:text-text'} ${accent ? 'text-grad font-semibold' : ''} ${className}`}>
      {icon && <span className="text-[14px] w-[18px] text-center shrink-0">{icon}</span>}
      <span className="truncate">{label}</span>
    </div>
  );
}

function SectionLabel({ children }) {
  return <div className="text-[11px] font-semibold text-text-3 px-2.5 pt-3 pb-1 tracking-wide">{children}</div>;
}

function WsHeader({ children, action }) {
  return (
    <div className="h-[54px] px-6 border-b border-border flex items-center gap-3 shrink-0">
      <h2 className="text-[17px] font-semibold flex-1 truncate">{children}</h2>
      {action}
    </div>
  );
}

function ChatInputCompact({ placeholder, value, onChange, onSend, disabled }) {
  const handleSend = () => { if (!disabled && (value || '').trim()) onSend?.(value); };
  return (
    <div className="border border-border-strong rounded-2xl p-3 px-3.5 bg-surface flex flex-col gap-2.5 text-[13px]">
      <textarea
        className="text-text bg-transparent border-0 focus:outline-none resize-none min-h-[36px] placeholder:text-text-3 w-full block leading-[1.5]"
        placeholder={placeholder}
        value={value || ''}
        onChange={(e) => onChange?.(e.target.value)}
        onKeyDown={(e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); } }}
        rows={2}
        disabled={disabled}
      />
      <div className="flex items-center gap-1">
        <button className="w-7 h-7 inline-flex items-center justify-center text-text-2 hover:text-text rounded-md hover:bg-black/[.04]" title="附件">
          <Icon.Paperclip width="16" height="16" />
        </button>
        <span className="flex-1" />
        <button onClick={handleSend} className="w-8 h-8 rounded-full bg-text text-white flex items-center justify-center hover:bg-black transition-colors">

function ChatInputFull({ placeholder, value, onChange, onSend }) {
  const handleSend = () => { if (!(value || '').trim()) return; onSend?.(value); };
  return (
    <div className="w-full max-w-[700px] mx-auto border border-border-strong rounded-xl py-3 px-3.5 bg-surface flex flex-col gap-2.5 shadow-soft">
      <textarea
        className="text-text bg-transparent border-0 focus:outline-none resize-none min-h-[40px] placeholder:text-text-3 w-full block text-[13.5px] leading-[1.55]"
        placeholder={placeholder}
        value={value || ''}
        onChange={(e) => onChange?.(e.target.value)}
        onKeyDown={(e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); } }}
        rows={2}
      />
      <div className="flex items-center justify-between">
        <button className="h-[26px] min-w-[26px] px-1.5 inline-flex items-center justify-center border border-border bg-surface rounded-full text-text-2 hover:bg-surface-2 hover:text-text hover:border-border-strong transition-all" title="上传文件">

        {active === 'history'  && activeConvId && <AiConvView conv={AI_CONVS[activeConvId]} />}
        {active === 'cross'    && <CrossInAi />}
        {active === 'discover' && <DiscoverInAi onChat={onChatPreset} onInstall={onInstallSkill} onDemo={onPlayDemo} />}
        {active === 'files'    && <FilesInAi />}
        {active === 'tasks'    && <TasksInAi />}
      </div>
    </div>
  );
}

/* ===========================  Main window (互联 APP)  =========================== */

function MainSidebar({ activeTab, onSelectTab, onOpenAi, onOpenSettings }) {
  return (
    <aside className="w-[200px] bg-surface-2 border-r border-border flex flex-col shrink-0">
      <div className="flex-1 min-h-0 overflow-y-auto py-2.5 px-2">
        <NavItem active={activeTab==='hub'}      icon="🔗" label="设备互联" onClick={() => onSelectTab('hub')} />
        <NavItem active={activeTab==='transfer'} icon="📤" label="小米互传" onClick={() => onSelectTab('transfer')} />

        <div className="h-px bg-border my-2 mx-1.5" />
        <SectionLabel>云服务</SectionLabel>
        <NavItem active={activeTab==='cloud-photo'} icon="📷" label="云相册"  onClick={() => onSelectTab('cloud-photo')} />
        <NavItem active={activeTab==='cloud-note'}  icon="📝" label="云笔记"  onClick={() => onSelectTab('cloud-note')} />
        <NavItem active={activeTab==='find-device'} icon="📍" label="查找设备" onClick={() => onSelectTab('find-device')} />

        <div className="h-px bg-border my-2 mx-1.5" />
        {/* 超级小爱:这里只是一个入口,点击新开第二窗口 */}
        <div onClick={onOpenAi}
             className="flex items-center gap-2 px-2.5 py-2 rounded-md text-[13px] cursor-pointer mb-px transition-colors bg-gradient-to-br from-[#eef2ff] to-[#f5edf3] hover:from-[#dbe4ff] hover:to-[#ede5f0] border border-[#d8def5]">
          <span className="w-[20px] h-[20px] rounded-full ai-avatar flex items-center justify-center text-white text-[10px] font-semibold shrink-0">✦</span>
          <span className="text-grad font-semibold">超级小爱</span>
          <Icon.External width="11" height="11" className="ml-auto text-text-3" />
        </div>
      </div>
      <div className="shrink-0 border-t border-border py-2 px-2.5 flex items-center gap-2">
        <button title="账号"
                className="w-7 h-7 rounded-full bg-gradient-to-br from-blue-300 to-purple-300 flex items-center justify-center text-[11px] text-white font-bold">倪</button>
        <span className="text-[11.5px] text-text-3 flex-1">倪妮</span>
        <button onClick={onOpenSettings} title="设置"
                className="w-7 h-7 rounded-md text-text-3 hover:text-text hover:bg-black/[.05] flex items-center justify-center">
          <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" strokeWidth="1.4">
            <circle cx="8" cy="8" r="2.2"/>
            <path d="M8 1.5v2M8 12.5v2M14.5 8h-2M3.5 8h-2M12.6 3.4l-1.4 1.4M4.8 11.2l-1.4 1.4M12.6 12.6l-1.4-1.4M4.8 4.8L3.4 3.4" strokeLinecap="round"/>
          </svg>
        </button>
      </div>
    </aside>
  );
}

function MainWindow({ onOpenAi, onOpenSettings }) {
  const [activeTab,    setActiveTab]    = useState('hub');
  const [activeNoteId, setActiveNoteId] = useState('lijiang');
  const [activeAlbumId, setActiveAlbumId] = useState('cam');
  const [hubTab, setHubTab] = useState('phone');

  const hubDeviceName = hubTab === 'phone' ? 'Xiaomi 17 Pro' : 'Xiaomi Pad 7';

  const renderRail = () => {
    if (activeTab === 'hub')         return <HubAiRail context={{ kind:'hub', deviceName:hubDeviceName }} />;
    if (activeTab === 'transfer')    return <HubAiRail context={{ kind:'transfer', deviceName:hubDeviceName }} />;
    if (activeTab === 'cloud-note')  return <NoteAgentRail note={NOTES_LIST.find(n => n.id === activeNoteId)} />;
    if (activeTab === 'cloud-photo') return <AlbumAgentRail album={ALBUMS.find(a => a.id === activeAlbumId)} />;
    if (activeTab === 'find-device') return <FindAgentRail />;
    return null;
  };

  return (
    <div className="app-bg border border-border rounded-2xl shadow-lg overflow-hidden flex flex-col h-[680px] relative">
      <TitleBar title="小米互联服务" />
      <div className="flex flex-1 min-h-0">
        <MainSidebar activeTab={activeTab} onSelectTab={setActiveTab} onOpenAi={onOpenAi} onOpenSettings={onOpenSettings} />
        <div className="flex-1 flex flex-col min-w-0">
          {activeTab === 'hub'         && <DeviceHubPage tab={hubTab} setTab={setHubTab} />}
          {activeTab === 'transfer'    && <TransferPage />}
          {activeTab === 'cloud-photo' && <CloudPhotoPage activeAlbumId={activeAlbumId} setActiveAlbumId={setActiveAlbumId} />}
          {activeTab === 'cloud-note'  && <CloudNotePage activeNoteId={activeNoteId} setActiveNoteId={setActiveNoteId} />}
          {activeTab === 'find-device' && <FindDevicePage />}
        </div>
        {renderRail()}
      </div>
    </div>
  );
}

/* ===========================  Top-level App (双窗口演示)  =========================== */

function App() {
  // 演示态:'main' | 'ai' | 'both'
  const [demoView, setDemoView] = useState('both');
  const [aiActive, setAiActive] = useState('new'); // 超级小爱窗口当前页
  const [aiActiveConvId, setAiActiveConvId] = useState(null);

  // 全局:设置窗 + 灵感广场反馈
  const [settingsOpen, setSettingsOpen] = useState(false);
  const [toast, setToast] = useState(null);
  const [demoItem, setDemoItem] = useState(null);

  const aiWindowRef = useRef(null);
  const openAi = () => {
    setDemoView('both');
    setTimeout(() => {
      aiWindowRef.current?.scrollIntoView({ behavior:'smooth', block:'start' });
    }, 50);
  };

  const onChatPreset = (item) => {
    setDemoView(v => v === 'main' ? 'both' : v);
    setAiActive('new');
    setAiActiveConvId(null);
    setToast(`已把「${item.name}」的提示词填到对话框,检查后发送即可`);
  };
  const onInstallSkill = (item) => {
    setToast(`已把「${item.name}」加到工具箱 · 新建对话时通过 + 引用`);
  };
  const onPlayDemo = (item) => setDemoItem(item);

  const aiProps = {
    active: aiActive,
    setActive: setAiActive,
    activeConvId: aiActiveConvId,
    setActiveConvId: setAiActiveConvId,
    onChatPreset,
    onInstallSkill,
    onPlayDemo,
  };

  return (
    <div className="max-w-[1320px] mx-auto px-5 py-6 pb-16">
      <h1 className="text-[22px] font-semibold mb-1 tracking-tight">方案 5 · 上下文绑定的右栏</h1>
      <p className="text-text-2 text-[14px] mb-3">主窗口右栏按页面配 · 笔记/相册/查找右栏对话绑定当前内容 · 超级小爱独立第二窗口</p>

      <div className="bg-accent-bg border-l-[3px] border-accent rounded-md px-3.5 py-2.5 text-[13px] text-text-2 mb-3 leading-[1.7]">
        <b className="text-text">核心改动</b>:
        <span className="ml-1">① 右栏不再全局,按页面配</span>·
        <span>② 跨设备 session 移到超级小爱窗口</span>·
        <span>③ 笔记/相册/查找右栏对话绑定当前内容,切换跟随</span>·
        <span>④ 灵感广场卡片用动作词代替术语 · 三种点击反馈</span>·
        <span>⑤ 超级小爱独立第二窗口,承接 5% 非互联场景</span>·
        <span>⑥ 设置只在主窗口里</span>
      </div>

      {/* 演示切换 */}
      <div className="mb-4 flex items-center gap-2 text-[12px] flex-wrap">
        <span className="text-text-3">演示视图:</span>
        <div className="flex bg-[#fff8d6] border border-[#e8c46a] rounded-lg p-0.5">
          <button onClick={() => setDemoView('main')} className={`px-3 py-1 rounded-md text-[12px] font-medium ${demoView==='main' ? 'bg-white text-text shadow-soft' : 'text-[#8a6a1c] hover:bg-white/60'}`}>主窗口</button>
          <button onClick={() => setDemoView('ai')}   className={`px-3 py-1 rounded-md text-[12px] font-medium ${demoView==='ai'   ? 'bg-white text-text shadow-soft' : 'text-[#8a6a1c] hover:bg-white/60'}`}>超级小爱窗口</button>
          <button onClick={() => setDemoView('both')} className={`px-3 py-1 rounded-md text-[12px] font-medium ${demoView==='both' ? 'bg-white text-text shadow-soft' : 'text-[#8a6a1c] hover:bg-white/60'}`}>双窗口对照</button>
        </div>
        <span className="text-text-3 ml-2">点左栏「超级小爱」打开第二窗口 · 主窗口齿轮打开设置</span>
        <span className="ml-auto text-text-3">提示:可去超级小爱的「灵感广场」试三种动作词</span>
      </div>

      {demoView === 'main' && <MainWindow onOpenAi={openAi} onOpenSettings={() => setSettingsOpen(true)} />}
      {demoView === 'ai'   && <SuperAiWindow {...aiProps} />}
      {demoView === 'both' && (
        <div className="flex flex-col gap-5">
          <div>
            <div className="text-[11.5px] text-text-3 mb-1.5 px-1 font-semibold tracking-wide">主窗口 · 小米互联服务</div>
            <MainWindow onOpenAi={openAi} onOpenSettings={() => setSettingsOpen(true)} />
          </div>
          <div ref={aiWindowRef}>
            <div className="text-[11.5px] text-text-3 mb-1.5 px-1 font-semibold tracking-wide">第二窗口 · 超级小爱</div>
            <SuperAiWindow {...aiProps} />
          </div>
        </div>
      )}

      <SettingsWindow open={settingsOpen} onClose={() => setSettingsOpen(false)} />
      <Toast toast={toast} onClose={() => setToast(null)} />
      <DemoModal item={demoItem} onClose={() => setDemoItem(null)} />

      <div className="mt-5 p-4 px-5 bg-surface border border-border rounded-xl text-[13px] text-text-2 leading-[1.8]">
        <b className="text-text">设计要点</b>:
        <ol className="list-decimal pl-5 mt-1.5 space-y-1">
          <li><b>主窗口左栏</b>只放核心功能 + 超级小爱入口(渐变描边强调"它会新开窗口")</li>
          <li><b>主窗口右栏</b>:互联/互传 = 偏跨设备调度的小爱(蓝紫);云笔记/相册/查找 = 处理当前内容的小爱(绿);跨设备 session 已移到第二窗口</li>
          <li><b>右栏对话</b>:绑定当前内容(笔记/相册/设备),切换对象时上下文跟随 · 提示词聚焦在当前对象上</li>
          <li><b>灵感广场</b>三种动作词:→ 开始对话(自动填提示词跳对话框) / + 添加到工具箱(toast) / ▶ 看示范(视频弹窗) · 用户不需要知道 skill/prompt 是什么</li>
          <li><b>第二窗口独立</b>:新建/跨设备 session/灵感/文件/任务都在这里 · 历史对话列表保留</li>
          <li><b>设置</b>:只在主窗口里,4 个 tab(账号/互联/云/小爱),超级小爱窗口不放设置入口</li>
        </ol>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
