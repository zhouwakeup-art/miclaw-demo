function FakeQR({ size = 150 }) {
  // 25x25 伪随机方格,带 3 个角定位标
  const N = 25;
  const cells = useMemo(() => {
    const arr = [];
    let seed = 7;
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      seed = (seed * 9301 + 49297) % 233280;
      const filled = (seed / 233280) > 0.55;
      arr.push({ r, c, filled });
    }
    return arr;
  }, []);
  const inFinder = (r, c) => (
    (r < 7 && c < 7) || (r < 7 && c >= N - 7) || (r >= N - 7 && c < 7)
  );
  const finderColor = (r, c) => {
    let er, ec;
    if (r < 7 && c < 7) { er = r; ec = c; }
    else if (r < 7) { er = r; ec = c - (N - 7); }
    else { er = r - (N - 7); ec = c; }
    if (er === 0 || er === 6 || ec === 0 || ec === 6) return '#000';
    if (er === 1 || er === 5 || ec === 1 || ec === 5) return '#fff';
    if (er >= 2 && er <= 4 && ec >= 2 && ec <= 4) return '#000';
    return '#fff';
  };
  const cell = size / N;
  return (
    <div className="relative bg-white" style={{ width: size, height: size }}>
      {cells.map(({ r, c, filled }) => {
        const isFinder = inFinder(r, c);
        const bg = isFinder ? finderColor(r, c) : (filled ? '#000' : '#fff');
        return <div key={`${r}-${c}`} style={{ position:'absolute', left: c * cell, top: r * cell, width: cell, height: cell, background: bg }} />;
      })}
    </div>
  );
}

// 设备记录:status 'connected' | 'offline'(局域网未发现,但有记录)
const PHONE_LIST = [
  { name: 'Xiaomi 17 Pro',     status: 'connected' },

const PAD_LIST = [

];

function DeviceHubPage({ onAddDevice, onTransferClick, onTransferDrop, hubState, setHubState, onLoggedIn, onRequestLogin }) {
  const [deviceTab, setDeviceTab] = useState('phone');
  const [pickerOpen, setPickerOpen] = useState(false);
  const [helpOpen, setHelpOpen] = useState(false);
  const [scanOpen, setScanOpen] = useState(false);
  const [removeConfirm, setRemoveConfirm] = useState(null);
  const [reconnecting, setReconnecting] = useState(false);
  const { loggedIn, phoneList, padList, selectedPhone, selectedPad, firstKind = 'phone' } = hubState;
  const privacyAgreed = !!hubState.privacyAgreed;
  const setPhoneList = (v) => setHubState(s => ({ ...s, phoneList: typeof v === 'function' ? v(s.phoneList) : v }));
  const setPadList   = (v) => setHubState(s => ({ ...s, padList:   typeof v === 'function' ? v(s.padList)   : v }));
  const setSelectedPhone = (v) => setHubState(s => ({ ...s, selectedPhone: v }));
  const setSelectedPad   = (v) => setHubState(s => ({ ...s, selectedPad:   v }));
  const fileInputRef = useRef(null);

  const isPhone = deviceTab === 'phone';
  const currentList = isPhone ? phoneList : padList;
  const setCurrentList = isPhone ? setPhoneList : setPadList;
  const currentName = isPhone ? selectedPhone : selectedPad;
  const setCurrentName = isPhone ? setSelectedPhone : setSelectedPad;
  const current = currentList.find(d => d.name === currentName);
  const hasRecord = currentList.length > 0;
  const isConnected = current?.status === 'connected';

  const [sendNotif, setSendNotif] = useState(null); // {fileName, size, progress}
  const [dragOver, setDragOver] = useState(false);
  const [addedToast, setAddedToast] = useState(false); // 添加成功 toast
  const sendTimerRef = useRef(null);
  const startSend = (f) => {
    if (!f || !currentName) return;
    const sizeStr = f.size > 1024 * 1024 * 1024
      ? (f.size / 1024 / 1024 / 1024).toFixed(1) + 'GB'
      : (f.size / 1024 / 1024).toFixed(1) + 'MB';
    setSendNotif({ fileName: f.name, size: sizeStr, progress: 0 });
    let p = 0;
    clearInterval(sendTimerRef.current);
    sendTimerRef.current = setInterval(() => {
      p += 8 + Math.random() * 6;
      if (p >= 100) { p = 100; clearInterval(sendTimerRef.current); setTimeout(() => setSendNotif(null), 1200); }
      setSendNotif(s => s ? { ...s, progress: Math.min(100, p) } : s);
    }, 220);
  };
  const onPickFile = (e) => {
    startSend(e.target.files?.[0]);
    e.target.value = '';
  };

  // 移除设备:连接中且选中要二次确认,其他直接移除
  const requestRemove = (dev) => {
    if (dev.status === 'connected' && dev.name === currentName) {
      setRemoveConfirm({ name: dev.name, kind: isPhone ? 'phone' : 'pad' });
    } else {
      doRemove(dev.name);
    }
  };
  const doRemove = (name) => {
    const next = currentList.filter(d => d.name !== name);
    setCurrentList(next);
    if (name === currentName) setCurrentName(next[0]?.name || '');
    setRemoveConfirm(null);
  };

  return (
    <>
      <WsHeader action={loggedIn && hasRecord ? (() => {
        // tab 顺序由 firstKind(首个被添加的类型)决定
        const order = firstKind === 'pad' ? ['pad', 'phone'] : ['phone', 'pad'];
        const labelOf = (k) => {
          if (k === 'phone') return phoneList.length === 0 ? '+ 添加手机' : '手机';
          return padList.length === 0 ? '+ 添加平板' : '平板';
        };
        return (
          <div className="flex items-center gap-2">
            <div className="flex bg-surface-2 border border-border rounded-lg p-0.5">
              {order.map(k => (
                <button key={k} onClick={() => setDeviceTab(k)}
                        className={`px-3 py-1 rounded-md text-[12px] font-medium transition-all ${deviceTab===k ? 'bg-surface shadow-soft text-text' : 'text-text-3 hover:text-text'}`}>
                  {labelOf(k)}
                </button>
              ))}
            </div>
          </div>
        );
      })() : null}>设备互联</WsHeader>
      <div
        className="flex-1 overflow-y-auto px-6 py-5 relative"
        onDragOver={(e) => { if (loggedIn && hasRecord) { e.preventDefault(); setDragOver(true); } }}
        onDragLeave={(e) => {
          // 只有真正离开容器才取消高亮(避免子元素触发)
          if (!e.currentTarget.contains(e.relatedTarget)) setDragOver(false);
        }}
        onDrop={(e) => {
          e.preventDefault();
          setDragOver(false);
          startSend(e.dataTransfer.files?.[0]);
        }}>
        {dragOver && (
          <div className="absolute inset-3 z-[150] rounded-2xl border-2 border-dashed border-accent bg-accent/[0.06] flex items-center justify-center pointer-events-none">
            <div className="text-[16px] font-semibold text-text-2">将文件拖放到此区域发送</div>
          </div>
        )}
        {!loggedIn ? (
          /* ===== 未登录态(走轮播引导 + 登录按钮) ===== */
          <DeviceLoggedOut isPhoneTab={isPhone} onLogin={onRequestLogin} />
        ) : !hasRecord ? (
          /* ===== 暂无设备(无记录) ===== */
          <DeviceEmptyState onAdd={() => setPickerOpen(true)} />
        ) : isPhone ? (
          /* ===== 手机 Tab(有记录) ===== */
          <div className="max-w-[520px] mx-auto flex flex-col items-center">
            <div className="self-start mb-1">
              <div onClick={() => setPickerOpen(true)} className="text-[22px] font-bold cursor-pointer hover:text-text-2 inline-flex items-center gap-1 select-none">
                {selectedPhone} <span className="text-text-3 text-[14px] font-normal">▾</span>
              </div>
              <div className="text-[13px] text-text-3 mt-0.5 flex items-center gap-1.5">
                {isConnected ? '局域网连接' : reconnecting ? (
                  <span className="inline-flex items-center gap-1.5 text-text-3">
                    <Spinner size={14} />
                    连接中
                  </span>
                ) : (
                  <span>
                    未连接,
                    <span onClick={() => setHelpOpen(true)} className="text-accent cursor-pointer hover:underline">查看连接帮助</span>
                    或
                    <span onClick={() => { setReconnecting(true); setTimeout(() => setReconnecting(false), 2400); }} className="text-accent cursor-pointer hover:underline">重新连接</span>
                  </span>
                )}
              </div>
            </div>
            {/* 设备图 */}
            <div className={`w-[140px] h-[200px] rounded-[24px] phone-grad shadow-card flex items-center justify-center my-6 ${!isConnected ? 'opacity-60' : ''}`}>
              <div className="w-[120px] h-[170px] rounded-[18px] wp-blue" />
            </div>
            {/* 操作胶囊 */}
            <div className="flex gap-2.5 mb-6">
              <ActionChip>🔗 启用热点</ActionChip>
              <ActionChip>🔔 响铃查找</ActionChip>
            </div>
            {/* 妙享桌面(未连接时禁用) */}
            <div className={`w-full bg-surface-2 border border-border rounded-xl p-4 ${!isConnected ? 'opacity-50 pointer-events-none' : ''}`}>
              <div className="text-[15px] font-semibold mb-1">妙享桌面</div>
              <div className="text-[12px] text-text-3 mb-3">打开手机屏幕或最近在手机上使用的应用</div>
              <div className="grid grid-cols-5 gap-2">
                <AppItem icon="📱" name="妙享桌面" />
                <AppItem icon="🖼️" name="相册" />
                <AppItem icon="📁" name="文件管理" />
                <AppItem icon="🌐" name="浏览器" />
                <AppItem icon="💬" name="短信" />
              </div>
            </div>
          </div>
        ) : (
          /* ===== 平板 Tab(有记录) ===== */
          <div className="max-w-[520px] mx-auto flex flex-col items-center">
            <div className="self-start mb-1">
              <div onClick={() => setPickerOpen(true)} className="text-[22px] font-bold cursor-pointer hover:text-text-2 inline-flex items-center gap-1 select-none">
                {selectedPad} <span className="text-text-3 text-[14px] font-normal">▾</span>
              </div>
              <div className="text-[13px] text-text-3 mt-0.5 flex items-center gap-1.5">
                {isConnected ? '局域网连接' : reconnecting ? (
                  <span className="inline-flex items-center gap-1.5 text-text-3">
                    <Spinner size={14} />
                    连接中
                  </span>
                ) : (
                  <span>
                    未连接,
                    <span onClick={() => setHelpOpen(true)} className="text-accent cursor-pointer hover:underline">查看连接帮助</span>
                    或
                    <span onClick={() => { setReconnecting(true); setTimeout(() => setReconnecting(false), 2400); }} className="text-accent cursor-pointer hover:underline">重新连接</span>
                  </span>
                )}
              </div>
            </div>
            {/* 设备图 */}
            <div className={`w-[220px] h-[160px] rounded-[16px] pad-grad shadow-card flex items-center justify-center my-6 ${!isConnected ? 'opacity-60' : ''}`}>
              <div className="w-[190px] h-[130px] rounded-[10px] wp-pad" />
            </div>
            {/* 操作胶囊 */}
            <div className="flex gap-2.5 mb-6">
              <ActionChip>🔔 响铃查找</ActionChip>
            </div>
            {/* 屏幕扩展(未连接禁用) */}
            <div className={`w-full bg-surface-2 border border-border rounded-xl p-4 ${!isConnected ? 'opacity-50 pointer-events-none' : ''}`}>
              <div className="flex items-center justify-between">
                <div>
                  <div className="text-[15px] font-semibold">屏幕扩展</div>
                  <div className="text-[12px] text-text-3 mt-0.5">把小米平板当作电脑的扩展显示器</div>
                </div>
                <button className="px-4 py-1.5 rounded-lg border border-border text-[13px] font-medium hover:bg-text hover:text-white hover:border-text transition-colors">开启</button>
              </div>
            </div>
          </div>
        )}
      </div>
      <DevicePickerDialog open={pickerOpen}
                          kind={isPhone ? 'phone' : 'pad'}
                          devices={currentList}
                          currentName={currentName}
                          onSelect={(name) => { setCurrentName(name); setPickerOpen(false); }}
                          onRemove={requestRemove}
                          onScan={() => { setPickerOpen(false); setScanOpen(true); }}
                          onClose={() => setPickerOpen(false)} />
      <ConnectHelpDialog open={helpOpen} onClose={() => setHelpOpen(false)} onScan={() => { setHelpOpen(false); setScanOpen(true); }} />
      <ScanAddDialog open={scanOpen}
                     kind={isPhone ? 'phone' : 'pad'}
                     onClose={() => setScanOpen(false)}
                     onSuccess={({ name, kind: scannedKind }) => {
                       const newDev = { name, status:'connected' };
                       setHubState(s => {
                         // 第一次添加任何设备 → 用扫到的类型作为 firstKind
                         const noRecord = s.phoneList.length === 0 && s.padList.length === 0;
                         const firstKind = noRecord ? scannedKind : s.firstKind;
                         if (scannedKind === 'phone') {
                           return { ...s, firstKind, phoneList: [newDev, ...s.phoneList.filter(d => d.name !== name)], selectedPhone: name };
                         }
                         return { ...s, firstKind, padList: [newDev, ...s.padList.filter(d => d.name !== name)], selectedPad: name };
                       });
                       setDeviceTab(scannedKind);
                       setScanOpen(false);
                       setPickerOpen(false);
                       setAddedToast(true);
                       setTimeout(() => setAddedToast(false), 2200);
                     }}
                     onBack={() => { setScanOpen(false); setPickerOpen(true); }} />
      {removeConfirm && (
        <ConfirmDialog
          title={`移除后会断开电脑与 ${removeConfirm.kind === 'phone' ? '小米手机' : '小米平板'} 的连接,可以通过"扫码添加"再次连接,确认移除?`}
          confirmLabel="移除"
          onConfirm={() => doRemove(removeConfirm.name)}
          onCancel={() => setRemoveConfirm(null)}
        />
      )}
      <input ref={fileInputRef} type="file" className="hidden" onChange={onPickFile} />
      <MacSendNotification notif={sendNotif} onClose={() => { clearInterval(sendTimerRef.current); setSendNotif(null); }} />
      {addedToast && (
        <div className="absolute top-3 left-1/2 -translate-x-1/2 z-[200] animate-fadeIn px-4 py-2 rounded-full bg-surface shadow-modal flex items-center gap-2 border border-border">
          <span className="w-[20px] h-[20px] rounded-full bg-accent flex items-center justify-center text-white text-[12px] font-bold">✓</span>
          <span className="text-[13px] text-text font-medium">添加成功</span>
        </div>

function SwipeableDeviceRow({ device, kind, active, onSelect, onRemove }) {
  const [offset, setOffset] = useState(0); // 0 = closed, -88 = revealed
  const startXRef = useRef(null);
  const startOffsetRef = useRef(0);
  const movedRef = useRef(false);
  const REVEAL = 88;

  const onMouseDown = (e) => {
    startXRef.current = e.clientX;
    startOffsetRef.current = offset;
    movedRef.current = false;
    const onMove = (ev) => {
      const dx = ev.clientX - startXRef.current;
      if (Math.abs(dx) > 4) movedRef.current = true;
      let next = startOffsetRef.current + dx;
      if (next > 0) next = 0;
      if (next < -REVEAL - 20) next = -REVEAL - 20;
      setOffset(next);
    };
    const onUp = () => {
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('mouseup', onUp);
      // 吸附:超过一半就展开
      setOffset(prev => prev < -REVEAL / 2 ? -REVEAL : 0);
    };
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
  };

  const handleClick = () => {
    if (movedRef.current) return;
    if (offset !== 0) { setOffset(0); return; }
    onSelect();
  };

  const connected = device.status === 'connected';

  return (
    <div className="relative overflow-hidden rounded-xl">
      {/* 底层红色移除按钮(仅在滑开时存在) */}
      {offset < 0 && (
        <button onClick={() => { setOffset(0); onRemove(); }}
                className="absolute top-0 right-0 bottom-0 w-[88px] bg-[#ff453a] hover:bg-[#e63a30] text-white text-[14px] font-semibold flex items-center justify-center">
          移除
        </button>
      )}
      {/* 顶层卡片 */}
      <div
        onMouseDown={onMouseDown}
        onClick={handleClick}
        style={{ transform:`translateX(${offset}px)`, transition: startXRef.current ? 'none' : 'transform 0.22s ease' }}
        className={`relative flex items-center gap-3 px-4 py-3 rounded-xl cursor-pointer select-none transition-colors
                   ${active ? 'bg-accent-bg' : 'bg-surface-2 hover:bg-surface-3'}`}
      >
        <div className="w-10 h-12 rounded-md flex items-center justify-center shrink-0 pointer-events-none overflow-hidden bg-white shadow-soft"
             style={{ background:'linear-gradient(180deg, #cfe2f3 0%, #6f9ec8 50%, #1f3a5a 100%)' }}>
          {/* 设备图(用渐变模拟手机壁纸) */}
        </div>
        <div className="flex-1 min-w-0 pointer-events-none">
          <div className={`text-[15px] font-medium truncate ${active ? 'text-accent' : 'text-text'}`}>{device.name}</div>
          {connected && <div className="text-[12px] text-accent/70 mt-0.5">已连接</div>}
        </div>
        {active && (
          <div className="w-[26px] h-[26px] rounded-full bg-accent text-white flex items-center justify-center text-[14px] shrink-0 pointer-events-none">✓</div>
        )}
      </div>
    </div>
  );
}

function Toast({ toast, onClose }) {
  useEffect(() => {
    if (!toast) return;
    const t = setTimeout(onClose, 2400);
    return () => clearTimeout(t);
  }, [toast, onClose]);
  if (!toast) return null;
  return (
    <div className="fixed top-6 left-1/2 -translate-x-1/2 z-[300] animate-fadeIn">
      <div className="px-4 py-2.5 rounded-full bg-text text-white shadow-modal text-[13px] flex items-center gap-2">
        <span className="w-[18px] h-[18px] rounded-full bg-ok flex items-center justify-center text-[10px]">✓</span>
        <span>{toast}</span>
      </div>
    </div>
  );
}

      <TitleBar title="小米互联服务" />
      <div className="flex flex-1 min-h-0">
        <MainSidebar activeTab={activeTab} onSelectTab={setActiveTab} onOpenAi={onOpenAi} onOpenSettings={onOpenSettings} />
        <div className="flex-1 flex flex-col min-w-0">
          {activeTab === 'hub'         && <DeviceHubPage onAddDevice={() => {}} onTransferClick={() => {}} onTransferDrop={() => {}} hubState={hubState} setHubState={setHubState} onLoggedIn={onLoggedIn} onRequestLogin={onRequestLogin} />}
          {activeTab === 'transfer'    && <TransferPage />}
          {activeTab === 'cloud-photo' && <CloudPhotoPage activeAlbumId={activeAlbumId} setActiveAlbumId={setActiveAlbumId} />}
          {activeTab === 'cloud-note'  && <CloudNotePage activeNoteId={activeNoteId} setActiveNoteId={setActiveNoteId} />}
          {activeTab === 'find-device' && <FindDevicePage />}
        </div>
        {renderRail()}
      </div>
    </div>
  );
}

/* ===========================  Top-level App (双窗口演示)  =========================== */

function App() {
  // 演示态:'main' | 'ai' | 'both'
  const [demoView, setDemoView] = useState('both');
  const [aiActive, setAiActive] = useState('new'); // 超级小爱窗口当前页
  const [aiActiveConvId, setAiActiveConvId] = useState(null);

  // 全局:设置窗 + 灵感广场反馈
  const [settingsOpen, setSettingsOpen] = useState(false);
  const [toast, setToast] = useState(null);
  const [demoItem, setDemoItem] = useState(null);

  // 设备互联:hubState + 隐私/登录/AI 协议弹窗
  const [hubState, setHubState] = useState({
    privacyAgreed: true,
    loggedIn: true,
    locale: 'cn',
    firstKind: 'phone',
    phoneList: PHONE_LIST,
    padList:   PAD_LIST,
    selectedPhone: 'Xiaomi 17 Pro',
    selectedPad:   'Xiaomi Pad 7',
  });
  const [aiAgreed, setAiAgreed] = useState(false);
  const [aiAgreementOpen, setAiAgreementOpen] = useState(false);
  const [appLoginOpen, setAppLoginOpen] = useState(false);

  const setHubDemo = (mode) => {
    const base = {
      privacyAgreed:true, loggedIn:true, locale:'cn', firstKind:'phone',
      phoneList: PHONE_LIST.map((d,i) => i===0 ? {...d, status:'connected'} : d),
      padList: PAD_LIST,
      selectedPhone: PHONE_LIST[0].name,
      selectedPad: PAD_LIST[0].name,
    };
    if (mode === 'no-privacy')      setHubState({ ...base, privacyAgreed:false, loggedIn:false, phoneList: [], padList: [], selectedPhone:'', selectedPad:'' });
    else if (mode === 'logged-out') setHubState({ ...base, loggedIn:false, phoneList: PHONE_LIST, padList: PAD_LIST });
    else if (mode === 'connected')  setHubState(base);
    else if (mode === 'offline')    setHubState({ ...base, phoneList: PHONE_LIST.map(d => ({...d, status:'offline'})), padList: PAD_LIST.map(d => ({...d, status:'offline'})) });
    else if (mode === 'empty')      setHubState({ ...base, phoneList: [], padList: [], selectedPhone:'', selectedPad:'' });
    else if (mode === 'intl')       setHubState({ ...base, loggedIn:false, locale:'cn', pendingLocale:'intl', phoneList: PHONE_LIST, padList: PAD_LIST });
  };

  const handleAppLogin = ({ aiAgreed: ai, privacyOnly } = {}) => {
    if (!privacyOnly) setHubState(s => ({ ...s, loggedIn: true, locale: s.pendingLocale || s.locale, pendingLocale: undefined }));
    if (ai) setAiAgreed(true);
  };
  const onAiAgreementConfirm = () => {
    setAiAgreed(true);
    setAiAgreementOpen(false);
  };

  const aiWindowRef = useRef(null);
  const openAi = () => {
    setDemoView('both');
    setTimeout(() => {
      aiWindowRef.current?.scrollIntoView({ behavior:'smooth', block:'start' });
    }, 50);
  };

  const onChatPreset = (item) => {
    setDemoView(v => v === 'main' ? 'both' : v);
    setAiActive('new');
    setAiActiveConvId(null);
    setToast(`已把「${item.name}」的提示词填到对话框,检查后发送即可`);
  };
  const onInstallSkill = (item) => {
    setToast(`已把「${item.name}」加到工具箱 · 新建对话时通过 + 引用`);
  };
  const onPlayDemo = (item) => setDemoItem(item);

  const aiProps = {
    active: aiActive,
    setActive: setAiActive,
    activeConvId: aiActiveConvId,
    setActiveConvId: setAiActiveConvId,
    onChatPreset,
    onInstallSkill,
    onPlayDemo,
  };

  const mainProps = {
    onOpenAi: openAi,
    onOpenSettings: () => setSettingsOpen(true),
    hubState,
    setHubState,
    onLoggedIn: handleAppLogin,
    onRequestLogin: () => setAppLoginOpen(true),
  };

  const showHubDemoBar = demoView === 'main' || demoView === 'both';

  return (
    <div className="max-w-[1320px] mx-auto px-5 py-6 pb-16">
      <h1 className="text-[22px] font-semibold mb-1 tracking-tight">方案 5 · 上下文绑定的右栏</h1>
      <p className="text-text-2 text-[14px] mb-3">主窗口右栏按页面配 · 笔记/相册/查找右栏对话绑定当前内容 · 超级小爱独立第二窗口</p>

      <div className="bg-accent-bg border-l-[3px] border-accent rounded-md px-3.5 py-2.5 text-[13px] text-text-2 mb-3 leading-[1.7]">
        <b className="text-text">核心改动</b>:
        <span className="ml-1">① 右栏不再全局,按页面配</span>·
        <span>② 跨设备 session 移到超级小爱窗口</span>·
        <span>③ 笔记/相册/查找右栏对话绑定当前内容,切换跟随</span>·
        <span>④ 灵感广场卡片用动作词代替术语 · 三种点击反馈</span>·
        <span>⑤ 超级小爱独立第二窗口,承接 5% 非互联场景</span>·
        <span>⑥ 设置只在主窗口里</span>
      </div>

      {/* 演示切换 */}
      <div className="mb-2 flex items-center gap-2 text-[12px] flex-wrap">
        <span className="text-text-3">演示视图:</span>
        <div className="flex bg-[#fff8d6] border border-[#e8c46a] rounded-lg p-0.5">
          <button onClick={() => setDemoView('main')} className={`px-3 py-1 rounded-md text-[12px] font-medium ${demoView==='main' ? 'bg-white text-text shadow-soft' : 'text-[#8a6a1c] hover:bg-white/60'}`}>主窗口</button>
          <button onClick={() => setDemoView('ai')}   className={`px-3 py-1 rounded-md text-[12px] font-medium ${demoView==='ai'   ? 'bg-white text-text shadow-soft' : 'text-[#8a6a1c] hover:bg-white/60'}`}>超级小爱窗口</button>
          <button onClick={() => setDemoView('both')} className={`px-3 py-1 rounded-md text-[12px] font-medium ${demoView==='both' ? 'bg-white text-text shadow-soft' : 'text-[#8a6a1c] hover:bg-white/60'}`}>双窗口对照</button>
        </div>
        <span className="text-text-3 ml-2">点左栏「超级小爱」打开第二窗口 · 主窗口齿轮打开设置</span>
        <span className="ml-auto text-text-3">提示:可去超级小爱的「灵感广场」试三种动作词</span>
      </div>

      {/* 设备互联演示态(仅在能看到主窗口时显示) */}
      {showHubDemoBar && (
        <div className="mb-4 flex items-center gap-2 text-[12px] flex-wrap">
          <span className="text-text-3">设备互联演示态:</span>
          <div className="flex bg-[#fff8d6] border border-[#e8c46a] rounded-lg p-0.5">
            <button onClick={() => setHubDemo('no-privacy')} className="px-2.5 py-1 rounded-md text-[12px] font-medium text-[#8a6a1c] hover:bg-white">未同意隐私</button>
            <button onClick={() => setHubDemo('logged-out')} className="px-2.5 py-1 rounded-md text-[12px] font-medium text-[#8a6a1c] hover:bg-white">未登录</button>
            <button onClick={() => setHubDemo('empty')} className="px-2.5 py-1 rounded-md text-[12px] font-medium text-[#8a6a1c] hover:bg-white">已登录无设备</button>
            <button onClick={() => setHubDemo('offline')} className="px-2.5 py-1 rounded-md text-[12px] font-medium text-[#8a6a1c] hover:bg-white">有设备未连接</button>
            <button onClick={() => setHubDemo('connected')} className="px-2.5 py-1 rounded-md text-[12px] font-medium text-[#8a6a1c] hover:bg-white">已连接</button>
            <button onClick={() => setHubDemo('intl')} className="px-2.5 py-1 rounded-md text-[12px] font-medium text-[#8a6a1c] hover:bg-white">国际账号</button>
          </div>
        </div>
      )}

      {demoView === 'main' && <MainWindow {...mainProps} />}
      {demoView === 'ai'   && <SuperAiWindow {...aiProps} />}
      {demoView === 'both' && (
        <div className="flex flex-col gap-5">
          <div>
            <div className="text-[11.5px] text-text-3 mb-1.5 px-1 font-semibold tracking-wide">主窗口 · 小米互联服务</div>
            <MainWindow {...mainProps} />
          </div>
          <div ref={aiWindowRef}>
            <div className="text-[11.5px] text-text-3 mb-1.5 px-1 font-semibold tracking-wide">第二窗口 · 超级小爱</div>
            <SuperAiWindow {...aiProps} />
          </div>
        </div>
      )}

      <SettingsWindow open={settingsOpen} onClose={() => setSettingsOpen(false)} />
      <Toast toast={toast} onClose={() => setToast(null)} />
      <DemoModal item={demoItem} onClose={() => setDemoItem(null)} />

      {/* 设备互联相关弹窗 */}
      <PrivacyConsentDialog
        open={!hubState.privacyAgreed}
        onAgree={({ aiAgreed: ai }) => { setHubState(s => ({ ...s, privacyAgreed: true })); if (ai) setAiAgreed(true); }} />
      <LoginDialog open={appLoginOpen}
                   onClose={() => setAppLoginOpen(false)}
                   onLoggedIn={(payload) => { setAppLoginOpen(false); handleAppLogin(payload); }}
                   presetAgreed={!!hubState.privacyAgreed} />
      <AiAgreementDialog open={aiAgreementOpen}
                         onCancel={() => setAiAgreementOpen(false)}
                         onConfirm={onAiAgreementConfirm} />

      <div className="mt-5 p-4 px-5 bg-surface border border-border rounded-xl text-[13px] text-text-2 leading-[1.8]">
        <b className="text-text">设计要点</b>:
        <ol className="list-decimal pl-5 mt-1.5 space-y-1">
          <li><b>主窗口左栏</b>只放核心功能 + 超级小爱入口(渐变描边强调"它会新开窗口")</li>
          <li><b>主窗口右栏</b>:互联/互传 = 偏跨设备调度的小爱(蓝紫);云笔记/相册/查找 = 处理当前内容的小爱(绿);跨设备 session 已移到第二窗口</li>
          <li><b>右栏对话</b>:绑定当前内容(笔记/相册/设备),切换对象时上下文跟随 · 提示词聚焦在当前对象上</li>
          <li><b>灵感广场</b>三种动作词:→ 开始对话(自动填提示词跳对话框) / + 添加到工具箱(toast) / ▶ 看示范(视频弹窗) · 用户不需要知道 skill/prompt 是什么</li>
          <li><b>第二窗口独立</b>:新建/跨设备 session/灵感/文件/任务都在这里 · 历史对话列表保留</li>
          <li><b>设置</b>:只在主窗口里,4 个 tab(账号/互联/云/小爱),超级小爱窗口不放设置入口</li>
        </ol>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
